name: release

on:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --run
      - run: npx tsc --noEmit

  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        uses: appleboy/ssh-action@v4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ubuntu/eora/bitrix-kanban
            git pull --ff-only
            docker compose up -d --build app
            docker image prune -f
            echo "deployed $(git rev-parse --short HEAD)"
      - name: Health check
        run: |
          sleep 15
          curl -sS -o /dev/null -w "%{http_code}\n" https://bitrix-flow.duckdns.org/api/oauth/check