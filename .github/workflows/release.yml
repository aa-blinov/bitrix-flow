name: release

# Tag-triggered release. A tag of v* produces a release with the artefacts
# the project ships, and the changelog section for that version becomes the
# release body.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract the version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Раздел версии из CHANGELOG становится телом релиза.
          awk -v v="$VERSION" '$0 ~ "^## \\[?" v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "В CHANGELOG.md нет раздела $VERSION"; exit 1; }

      - name: Build
        # Образ, который уходит в прод, собирается Dockerfile (так же, как docker compose
        # up --build из README). Секрет Sentry не нужен: без него просто не грузятся source maps.
        run: docker build --build-arg APP_RELEASE="${{ steps.version.outputs.version }}" -t bitrix-flow:${{ steps.version.outputs.version }} .

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
