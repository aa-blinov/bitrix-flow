name: snapshots

# Screenshot baselines are compared pixel by pixel inside one container image,
# so they have to be produced in that image too. Regenerating them on a
# developer machine writes images CI will never accept, which is why this
# workflow exists instead of a line in the README.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project, or empty for the whole suite'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    name: Regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      mongodb:
        image: mongo:7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Seed the test database
        run: node scripts/seed-test-db.mjs
        env:
          MONGO_URL: mongodb://mongodb:27017
      - name: Rewrite the baselines
        run: npx playwright test ${PROJECT:+--project=$PROJECT} --update-snapshots
        env:
          CI: 'true'
          TEST_MONGO_URL: mongodb://mongodb:27017
          PROJECT: ${{ inputs.project }}
      - name: Push the branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/snapshot-update
          git add tests/
          if git diff --cached --quiet; then
            echo "Baselines are already current."
            exit 0
          fi
          git commit -m "test: regenerate the screenshot baselines"
          git push --force origin chore/snapshot-update
