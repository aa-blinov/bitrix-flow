version: 2

# Dependency updates are the cheapest maintenance a repository can do, and
# dependabot's grouping keeps the pull requests small enough to review.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      actions:
        # The house standard is excluded on purpose. Dependabot reads the
        # reference to it as a dependency, but it does not propose a bump for
        # a standard published in the same repository as its own tooling.
        # The bump workflow in aa-blinov/golden-repo opens that pull request
        # instead, and it arrives on its own.
        patterns: ['*', '!aa-blinov/golden-repo']
    ignore:
      # Закреплён на последней MIT-версии (см. ci.yml): с 2.0 нужна лицензия, с 3.0 ещё и токен.
      - dependency-name: gitleaks/gitleaks-action

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, javascript]
    groups:
      # Мажоры отдельными PR: одна пачка с TypeScript 7 и Playwright 1.65 падала целиком,
      # и вместе с ней застревали безопасные минорные обновления.
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Версия Playwright привязана к образу mcr.microsoft.com/playwright и эталонам
      # скриншотов: обновляется вручную вместе с ними.
      - dependency-name: '@playwright/test'
      - dependency-name: playwright
      # Типы держим на версии Node с прода (Dockerfile, CI), иначе в коде появится API,
      # которого на сервере нет.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint ещё не поддерживает TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, go]
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, rust]
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      # Node меняем вручную и только на LTS, вместе с CI: dependabot предлагал нечётную 25.
      - dependency-name: node
        update-types: [version-update:semver-major]
