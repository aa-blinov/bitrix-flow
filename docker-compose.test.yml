# Отдельная база для UI-тестов: боевые данные трогать нельзя, а скриншотам
# нужен предсказуемый набор задач.
# Своё имя проекта: без него compose брал имя каталога, как у прода, и при
# `up` пытался снести общую сеть bitrix-kanban_default.
name: bitrix-flow-uitest

services:
  mongodb-test:
    image: mongo:7
    container_name: bitrix-flow-test-mongo
    restart: 'no'
    command: ['--quiet']
    ports:
      - '27018:27017'
    tmpfs:
      - /data/db
