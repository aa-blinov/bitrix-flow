services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: bitrix_kanban
      HOSTNAME: 0.0.0.0
      PORT: 3000
      MOCK_B24: ${MOCK_B24:-0}
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: bitrix-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
