services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: bitrix_kanban
      HOSTNAME: 0.0.0.0
      PORT: 3000
      MOCK_B24: ${MOCK_B24:-0}
    expose:
      - '3000'
    depends_on:
      mongodb:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DUCKDNS_TOKEN: DUCKDNS_TOKEN_REDACTED
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: bitrix-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:
