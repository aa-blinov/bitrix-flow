x-logging: &logging # Без ротации journald/json-файлы растут до заполнения диска.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
        APP_RELEASE: ${APP_RELEASE:-dev}
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env.local
    environment:
      # Приложению хватает readWrite на своей базе: под root оно ходило зря.
      MONGO_URL: mongodb://${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env.local}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env.local}@mongodb:27017/bitrix_kanban?authSource=bitrix_kanban
      MONGO_DB: bitrix_kanban
      HOSTNAME: 0.0.0.0
      PORT: 3000
      MOCK_B24: ${MOCK_B24:-0}
      # Ошибки сервера уезжают в GlitchTip; без переменной отчёты отключены.
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      APP_RELEASE: ${APP_RELEASE:-dev}
    expose:
      - '3000'
    # Живость приложения, а не только контейнера: /api/health пингует Mongo,
    # поэтому зависший коннект виден снаружи и docker перезапустит сервис.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      mongodb:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Same DuckDNS account/token also covers the cast-team.duckdns.org
      # site added below — DuckDNS tokens are per-account, not per-subdomain.
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env.local}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - cast-team_default
    depends_on:
      app:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: bitrix-mongodb
    restart: unless-stopped
    command: ['mongod', '--auth', '--bind_ip_all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env.local}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env.local}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env.local}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env.local}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin?authSource=admin" --eval "db.adminCommand({ping:1})"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:

networks:
  default:
  # cast-team's own compose network — lets this Caddy reach cast-team's
  # cast-server container by name for the added cast-team.duckdns.org site,
  # without publishing cast-server's port to the host.
  cast-team_default:
    external: true
